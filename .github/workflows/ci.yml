name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests (plain JVM for the core, Robolectric for the Android layer), lint and the builds. No emulator here:
  # the real check runs on a local emulator before each release.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's home; every run restores the newest, main saves one a week.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: The tag matches SDK_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(./gradlew -q printSdkVersion --console=plain)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but SDK_VERSION $v"; exit 1; }
      - name: Tests, lint and builds
        run: ./gradlew :antnexo:testDebugUnitTest :antnexo:lintDebug :antnexo:assembleRelease :antnexo-compose:lintDebug :antnexo-compose:assembleRelease :sample:lintDebug :sample:assembleRelease --console=plain
      - if: github.event_name == 'push' && github.ref_name == 'main' && steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop
      - if: github.event_name == 'push' && github.ref_name == 'main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ steps.week.outputs.week }}
